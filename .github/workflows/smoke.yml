name: Smoke

# Verifies a *published* release, not a branch: the two installers the docs name, the tool
# package, and the extension package the release publishes beside it — install, verify, discover,
# uninstall. Run it after the tag exists:
#
#   gh workflow run smoke.yml -f tag=v0.1.0-rc.1
#
# It is deliberately keyless: a session against a real model needs a provider key, which
# belongs on the maintainer's machine, not in a CI secret. That part of the release smoke
# stays local.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to install and check, for example v0.1.0-rc.1'
        required: true
        type: string

permissions:
  contents: read

env:
  # The sample the release packs and pushes beside the tool (release.yml). Installing it by id is
  # the only part of the release smoke that exercises a published *package* rather than a binary:
  # version resolution against the feed, the download's SHA-512, extraction, the record and the
  # content check. The feed is whatever the runner's NuGet configuration names — nuget.org.
  LUNATE_SAMPLE_PACKAGE: Lunate.Extensions.Subagents

jobs:
  smoke:
    name: smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout the installer scripts
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install with install.sh
        if: runner.os != 'Windows'
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          sh install.sh --version "$TAG" --prefix "$RUNNER_TEMP/lunate"

      - name: Install with install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TAG: ${{ inputs.tag }}
        run: |
          $prefix = Join-Path $env:RUNNER_TEMP 'lunate'
          ./install.ps1 -Version $env:TAG -Prefix $prefix

      # The package steps run in bash on every runner, so the Windows path is resolved to the
      # mixed form Git Bash can execute, and the state root is a throwaway directory: the smoke
      # must not read or write a maintainer's real store, and a dirty store must not make it pass.
      - name: Resolve the binary and the state root
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP"
          if command -v cygpath >/dev/null 2>&1; then
            root="$(cygpath -m "$RUNNER_TEMP")"
          fi
          case "$RUNNER_OS" in
            Windows) binary="$root/lunate/lunate.exe" ;;
            *) binary="$root/lunate/lunate" ;;
          esac
          echo "LUNATE_TMP=$root" >> "$GITHUB_ENV"
          echo "LUNATE=$binary" >> "$GITHUB_ENV"
          echo "LUNATE_HOME=$root/lunate-home" >> "$GITHUB_ENV"

      - name: Install with Homebrew
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          brew tap wdaniel1993/tap
          HOMEBREW_NO_AUTO_UPDATE=1 brew install wdaniel1993/tap/lunate
          "$(brew --prefix)/bin/lunate" --version | tee brew-version.txt
          grep -F "${TAG#v}" brew-version.txt
        env:
          TAG: ${{ inputs.tag }}

      - name: Install with Scoop
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TAG: ${{ inputs.tag }}
        run: |
          Set-ExecutionPolicy Bypass -Scope Process -Force
          Invoke-RestMethod https://get.scoop.sh | Invoke-Expression
          scoop bucket add wdaniel1993 https://github.com/wdaniel1993/scoop-bucket
          scoop install lunate
          $version = lunate --version
          $version
          if (-not $version.StartsWith($env:TAG.Substring(1))) {
            throw "scoop's lunate prints '$version', which does not start with $($env:TAG.Substring(1))"
          }

      - name: The installed binary is the tag, and starts
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version="$("$LUNATE" --version)"
          echo "$version"
          # The tag carries a leading v; the binary prints the package version plus build metadata.
          case "$version" in
            "${TAG#v}"*) ;;
            *) echo "lunate --version printed '$version', which does not start with ${TAG#v}" >&2; exit 1 ;;
          esac
          "$LUNATE" --help
          "$LUNATE" packages

      - name: Install the extension package from the feed
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          # A bare install asks for the latest *stable* version, and a prerelease tag publishes
          # none, so the tag's exact version is pinned here. The bare form has its own step.
          out=""
          for attempt in 1 2 3 4 5; do
            if out="$("$LUNATE" install "$LUNATE_SAMPLE_PACKAGE@$version" 2>"$LUNATE_TMP/install.err")"; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              cat "$LUNATE_TMP/install.err" >&2
              echo "lunate install did not succeed after $attempt attempts" >&2
              exit 1
            fi
            # A freshly pushed package is invisible for a moment while the feed indexes it.
            sleep $((attempt * 20))
          done
          printf '%s\n' "$out"
          grep -qx "package: $LUNATE_SAMPLE_PACKAGE $version" <<<"$out"
          grep -q '^extension: subagents ' <<<"$out"

      - name: The package is listed, verifies, and its extension is discovered
        shell: bash
        run: |
          set -euo pipefail
          listed="$("$LUNATE" packages --json)"
          printf '%s\n' "$listed"
          grep -q "\"id\":\"$LUNATE_SAMPLE_PACKAGE\"" <<<"$listed"
          verified="$("$LUNATE" packages --verify)"
          printf '%s\n' "$verified"
          grep -q ', verified$' <<<"$verified"
          # The install wrote the extension where the loader looks, and it is pending trust — the
          # documented state after an install. Discovery proves the manifest the package carried.
          discovered="$("$LUNATE" extensions)"
          printf '%s\n' "$discovered"
          grep -qE '^subagents ' <<<"$discovered"

      - name: Uninstall leaves nothing behind
        shell: bash
        run: |
          set -euo pipefail
          "$LUNATE" uninstall "$LUNATE_SAMPLE_PACKAGE"
          remaining="$("$LUNATE" packages)"
          [ "$remaining" = 'packages: none installed' ]
          if [ -e "$LUNATE_HOME/extensions/subagents" ]; then
            echo "the uninstall left $LUNATE_HOME/extensions/subagents behind" >&2
            exit 1
          fi
          if [ -d "$LUNATE_HOME/packages" ] && find "$LUNATE_HOME/packages" -name install.json | grep -q .; then
            echo "the uninstall left an install record behind" >&2
            exit 1
          fi

      # A stable tag publishes a stable package, so the documented command — no version — has to
      # resolve one. It is a separate store because it installs whatever the feed serves as latest,
      # which is not necessarily this tag when the smoke is re-run later.
      - name: A bare install resolves the latest stable version
        if: ${{ !contains(inputs.tag, '-') }}
        shell: bash
        env:
          LUNATE_HOME: ${{ runner.temp }}/lunate-home-latest
        run: |
          set -euo pipefail
          out="$("$LUNATE" install "$LUNATE_SAMPLE_PACKAGE")"
          printf '%s\n' "$out"
          grep -q "^package: $LUNATE_SAMPLE_PACKAGE " <<<"$out"
          "$LUNATE" packages --verify
          "$LUNATE" uninstall "$LUNATE_SAMPLE_PACKAGE"
