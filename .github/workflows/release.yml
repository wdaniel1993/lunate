name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  gate:
    name: verify gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The public-API step diffs PublicAPI.Shipped.txt against the merge
          # base with origin/main, so the checkout needs full history.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            global.json
            Directory.Build.props
            **/*.csproj

      # The de-AT culture pass runs under LC_ALL=de_AT.UTF-8. The ubuntu runner
      # image does not ship that locale, so bash children warn to stderr
      # ("setlocale: LC_ALL: cannot change locale"), which tests that capture a
      # child's stderr exactly would see. Generate it so the pass is faithful.
      - name: Generate de_AT locale (Linux)
        if: runner.os == 'Linux'
        run: sudo locale-gen de_AT.UTF-8

      - name: Install hyperfine (Linux)
        run: |
          set -euo pipefail
          version=1.20.0
          asset="hyperfine-v${version}-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSL -o "${RUNNER_TEMP}/${asset}" \
            "https://github.com/sharkdp/hyperfine/releases/download/v${version}/${asset}"
          printf '%s  %s\n' \
            3285ec7959285288137043dd81dce0dde056227018a8277532d9a364b4f03c2b \
            "${RUNNER_TEMP}/${asset}" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/${asset}" -C "${RUNNER_TEMP}"
          install "${RUNNER_TEMP}/hyperfine-v${version}-x86_64-unknown-linux-musl/hyperfine" \
            /usr/local/bin/hyperfine
          hyperfine --version

      - name: Check tag against version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props)"
          tag="${GITHUB_REF_NAME#v}"
          if [ -z "$version" ] || [ "$tag" != "$version" ]; then
            echo "release: tag ${GITHUB_REF_NAME} does not match <Version>${version}</Version> in Directory.Build.props" >&2
            exit 1
          fi

      - name: Verify
        env:
          BUDGET_MS: 250
        run: bash scripts/verify.sh

  publish:
    name: publish (${{ matrix.rid }})
    needs: gate
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64
          - os: windows-latest
            rid: win-x64
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            global.json
            Directory.Build.props
            **/*.csproj

      - name: Publish (${{ matrix.rid }})
        run: >
          dotnet publish src/Lunate.Coding/Lunate.Coding.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:PublishReadyToRun=true
          -o artifacts/publish/${{ matrix.rid }}
          --nologo

      - name: Archive (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: tar -czf "artifacts/lunate-${{ matrix.rid }}.tar.gz" -C "artifacts/publish/${{ matrix.rid }}" lunate

      - name: Archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "artifacts/publish/${{ matrix.rid }}/lunate.exe" -DestinationPath "artifacts/lunate-${{ matrix.rid }}.zip"

      - name: Upload target archive
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.rid }}
          path: artifacts/lunate-*
          if-no-files-found: error

  pack:
    name: pack (dotnet tool)
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            global.json
            Directory.Build.props
            **/*.csproj

      - name: Pack tool
        run: dotnet pack src/Lunate.Coding/Lunate.Coding.csproj -c Release -o dist --nologo

      - name: Upload tool package
        uses: actions/upload-artifact@v7
        with:
          name: release-nupkg
          path: dist/*.nupkg
          if-no-files-found: error

  release:
    name: attach release assets
    needs: [publish, pack]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Write checksums
        run: |
          set -euo pipefail
          (cd dist && sha256sum lunate-* > SHA256SUMS && cat SHA256SUMS)

      - name: Attach archives to the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "$tag" --generate-notes
          gh release upload "$tag" dist/* --clobber
