name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  gate:
    name: verify gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The public-API step diffs PublicAPI.Shipped.txt against the merge
          # base with origin/main, so the checkout needs full history.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            global.json
            Directory.Build.props
            **/*.csproj

      # The de-AT culture pass runs under LC_ALL=de_AT.UTF-8. The ubuntu runner
      # image does not ship that locale, so bash children warn to stderr
      # ("setlocale: LC_ALL: cannot change locale"), which tests that capture a
      # child's stderr exactly would see. Generate it so the pass is faithful.
      - name: Generate de_AT locale (Linux)
        if: runner.os == 'Linux'
        run: sudo locale-gen de_AT.UTF-8

      - name: Install hyperfine (Linux)
        run: |
          set -euo pipefail
          version=1.20.0
          asset="hyperfine-v${version}-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSL -o "${RUNNER_TEMP}/${asset}" \
            "https://github.com/sharkdp/hyperfine/releases/download/v${version}/${asset}"
          printf '%s  %s\n' \
            3285ec7959285288137043dd81dce0dde056227018a8277532d9a364b4f03c2b \
            "${RUNNER_TEMP}/${asset}" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/${asset}" -C "${RUNNER_TEMP}"
          install "${RUNNER_TEMP}/hyperfine-v${version}-x86_64-unknown-linux-musl/hyperfine" \
            /usr/local/bin/hyperfine
          hyperfine --version

      - name: Check tag against version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props)"
          tag="${GITHUB_REF_NAME#v}"
          if [ -z "$version" ] || [ "$tag" != "$version" ]; then
            echo "release: tag ${GITHUB_REF_NAME} does not match <Version>${version}</Version> in Directory.Build.props" >&2
            exit 1
          fi

      - name: Verify
        env:
          BUDGET_MS: 250
        run: bash scripts/verify.sh

  publish:
    name: publish (${{ matrix.rid }})
    needs: gate
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64
          - os: windows-latest
            rid: win-x64
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            global.json
            Directory.Build.props
            **/*.csproj

      - name: Publish (${{ matrix.rid }})
        run: >
          dotnet publish src/Lunate.Coding/Lunate.Coding.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:PublishReadyToRun=true
          -o artifacts/publish/${{ matrix.rid }}
          --nologo

      - name: Archive (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: tar -czf "artifacts/lunate-${{ matrix.rid }}.tar.gz" -C "artifacts/publish/${{ matrix.rid }}" lunate

      - name: Archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "artifacts/publish/${{ matrix.rid }}/lunate.exe" -DestinationPath "artifacts/lunate-${{ matrix.rid }}.zip"

      - name: Upload target archive
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.rid }}
          path: artifacts/lunate-*
          if-no-files-found: error

  pack:
    name: pack (dotnet tool)
    needs: gate
    runs-on: ubuntu-latest
    # Trusted Publishing replaces the long-lived API key: the job asks GitHub for
    # an OIDC token, nuget.org trades it for a key valid for minutes, and the
    # policy on the other side names this repository, this workflow file and this
    # environment. A dry run must not publish, so both steps below are guarded.
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            global.json
            Directory.Build.props
            **/*.csproj

      - name: Pack tool
        run: dotnet pack src/Lunate.Coding/Lunate.Coding.csproj -c Release -o dist --nologo

      # The extension package is a release artifact on the same tag as the tool: the release smoke
      # installs it by id from nuget.org, and `lunate install` is only as proven as the last package
      # a feed actually served. The sample is the reference extension — the one a user wants first.
      - name: Pack the extension package
        run: dotnet pack samples/extensions/subagents/SubagentsExtension/SubagentsExtension.csproj -c Release -o dist --nologo

      - name: Sign in to nuget.org
        id: nuget
        if: github.event_name == 'push'
        uses: NuGet/login@v1
        with:
          user: wdaniel1993

      - name: Push the packages to nuget.org
        if: github.event_name == 'push'
        run: >-
          dotnet nuget push dist/*.nupkg
          --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}"
          --source https://www.nuget.org/api/v2/package
          --skip-duplicate

      # A dry run must not publish, but it can prove the policy works: the exchange is the
      # part that fails when the repository, workflow file or environment stops matching.
      - name: Sign in to nuget.org (dry run)
        id: nuget_dry_run
        if: github.event_name == 'workflow_dispatch'
        uses: NuGet/login@v1
        with:
          user: wdaniel1993

      - name: Report the exchange
        if: github.event_name == 'workflow_dispatch'
        env:
          KEY: ${{ steps.nuget_dry_run.outputs.NUGET_API_KEY }}
        run: echo "Trusted Publishing exchange succeeded; the key is ${#KEY} characters and nothing was pushed."

      - name: Upload the packages
        uses: actions/upload-artifact@v7
        with:
          name: release-nupkg
          path: dist/*.nupkg
          if-no-files-found: error

  release:
    name: attach release assets
    needs: [publish, pack]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Write checksums
        run: |
          set -euo pipefail
          # Every attached asset is covered: the three archives and both packages.
          (cd dist && sha256sum lunate-* *.nupkg > SHA256SUMS && cat SHA256SUMS)

      - name: Attach archives to the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "$tag" --generate-notes
          fi
          # A candidate must never be "latest": install.sh and install.ps1 resolve latest/download
          # when no version is given, and v0.1.0-rc.1 was served as the stable release until this
          # line existed.
          case "$tag" in
            *-*) gh release edit "$tag" --prerelease --latest=false ;;
          esac
          gh release upload "$tag" dist/* --clobber
