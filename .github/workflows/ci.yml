name: CI

on:
  push:
    branches: [main]
    # Docs/spec-only pushes skip CI (they cannot break the build). A push that
    # touches any code or workflow file still runs the full matrix; docs-only
    # pushes are linted by the docs-lint workflow instead.
    paths-ignore:
      - 'docs/**'
      - 'adr/**'
      - 'openspec/**'
      - '*.md'
  pull_request:
    # ready_for_review is not in GitHub's default set: without it, a draft that
    # is marked ready would keep the statuses of the run it had as a draft.
    types: [opened, synchronize, reopened, ready_for_review]
  # The merge queue runs the required check on the combined head of a batch. Without this trigger
  # `ci-ok` never reports for a merge group and the queue stalls.
  merge_group:
  workflow_dispatch:

# Supersede in-flight runs for the same ref instead of queueing duplicates.
concurrency:
  group: ci-${{ github.ref }}
  # A merge group's gate must run to completion: cancelling it fails the batch. Pull requests and
  # pushes still supersede their own older runs.
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

permissions:
  contents: read

jobs:
  # Which gate this change needs. Prose (docs, ADRs, OpenSpec proposals/specs, root Markdown) cannot
  # break the build, so it gets the three-minute docs profile; anything else -- including any change
  # to this workflow -- gets the full matrix. The rule lives in scripts/ci-plan.sh, deny-by-default,
  # and its self-test runs here so a broken plan cannot silently downgrade a code pull request.
  plan:
    name: plan
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    outputs:
      profile: ${{ steps.decide.outputs.profile }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The decision diffs the pull request against its base, so the history has to be there.
          fetch-depth: 0

      - name: Tooling self-tests
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci-plan.sh --self-test
          bash scripts/ci-ok.sh --self-test
          python3 scripts/docs-sync --self-test
          bash scripts/no-docs-references.sh --self-test
          bash scripts/no-wip-commits.sh --self-test

      # A wip commit is the queue driver's safety net for a stalled session: it preserves work that
      # would otherwise be lost, and it belongs in a draft. This job only runs for a pull request
      # that is ready for review, so reaching it with a wip subject means the draft flag came off
      # before the commit was rewritten -- the one thing the safety net must never allow.
      - name: No wip commits in a ready pull request
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash scripts/no-wip-commits.sh

      - name: Decide the profile
        id: decide
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "merge_group" ]; then
            # The batch is judged by what it changes against the branch it will land on, exactly as
            # a pull request is: a batch of prose-only pull requests gets the docs profile.
            git diff --name-status -M "${BASE_SHA}...HEAD" >changed.txt
            echo "changed paths (merge group):"
            cat changed.txt
            bash scripts/ci-plan.sh --paths-file changed.txt >>"${GITHUB_OUTPUT}"
            cat "${GITHUB_OUTPUT}"
            exit 0
          fi
          if [ "${GITHUB_EVENT_NAME}" != "pull_request" ]; then
            # A push to main already filters prose-only changes (paths-ignore above), so whatever
            # arrives here gets the whole gate.
            echo "not a pull request: the full gate runs"
            echo "profile=full" >>"${GITHUB_OUTPUT}"
            exit 0
          fi
          git diff --name-status -M "origin/${BASE_REF}...HEAD" >changed.txt
          echo "changed paths:"
          cat changed.txt
          bash scripts/ci-plan.sh --paths-file changed.txt >>"${GITHUB_OUTPUT}"
          cat "${GITHUB_OUTPUT}"

  verify:
    name: verify (${{ matrix.os }})
    needs: plan
    if: needs.plan.outputs.profile == 'full'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # budget_ms: calibrated in spike S-3 (docs/spikes/S-3/report.md, ADR 0005
          # accepted 2026-10-04) — runner startup median + ~50% headroom, rounded up to 50 ms.
          # Re-calibrate when a runner image or baseline shifts. The local default
          # in scripts/perf.sh stays 150 ms.
          # memory_gate_mb: idle peak-RSS gate (MB) per OS (ADR 0009); provisional
          # 150 until the T-18 TUI subject exists (report-only until then).
          - os: ubuntu-latest
            rid: linux-x64
            budget_ms: 250
            memory_gate_mb: 150
          - os: macos-latest
            rid: osx-arm64
            budget_ms: 300
            # The shared macOS runner's floor is bimodal (~80-240 ms quiet, ~310-330 ms loaded), so a
            # breach here is measured and printed, not fatal; `perf (macos-latest)` enforces the budget
            # on a leg that runs nothing else.
            budget_enforce: 0
            memory_gate_mb: 150
          - os: windows-latest
            rid: win-x64
            budget_ms: 350
            memory_gate_mb: 150
    env:
      RID: ${{ matrix.rid }}
      # English-first CI logs: pin the dotnet CLI / test-runner UI text. The
      # de-AT culture pass still sets the test culture via LANG; only UI
      # strings are pinned (defense in depth over scripts/verify.*).
      DOTNET_CLI_UI_LANGUAGE: en
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The public-API step diffs PublicAPI.Shipped.txt against the merge
          # base with origin/main; PR checkouts are shallow and lack origin/main,
          # so fetch full history.
          fetch-depth: 0
        # Force LF checkout on windows: the public-API step diffs tracked
        # *PublicAPI.Shipped.txt files, so autocrlf rewrites would show as noise.
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: "false"

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            global.json
            Directory.Build.props
            **/*.csproj

      # The de-AT culture pass runs under LC_ALL=de_AT.UTF-8. The ubuntu runner
      # image does not ship that locale, so bash children warn to stderr
      # ("setlocale: LC_ALL: cannot change locale"), which tests that capture a
      # child's stderr exactly would see. Generate it so the pass is faithful.
      - name: Generate de_AT locale (Linux)
        if: runner.os == 'Linux'
        run: sudo locale-gen de_AT.UTF-8

      # The bash guard's platform matrix: the Linux leg runs the bubblewrap refusal (or, when the
      # runtime refuses user namespaces — Ubuntu AppArmor — the detection notice) for real.
      # ADR 0024.
      - name: Install bubblewrap (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends bubblewrap
          bwrap --version

      - name: Install hyperfine (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          version=1.20.0
          asset="hyperfine-v${version}-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSL -o "${RUNNER_TEMP}/${asset}" \
            "https://github.com/sharkdp/hyperfine/releases/download/v${version}/${asset}"
          printf '%s  %s\n' \
            3285ec7959285288137043dd81dce0dde056227018a8277532d9a364b4f03c2b \
            "${RUNNER_TEMP}/${asset}" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/${asset}" -C "${RUNNER_TEMP}"
          install "${RUNNER_TEMP}/hyperfine-v${version}-x86_64-unknown-linux-musl/hyperfine" \
            /usr/local/bin/hyperfine
          hyperfine --version

      - name: Install hyperfine (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          brew install hyperfine
          hyperfine --version

      - name: Install hyperfine (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = '1.20.0'
          $asset = "hyperfine-v$version-x86_64-pc-windows-msvc.zip"
          $zip = Join-Path $env:RUNNER_TEMP $asset
          Invoke-WebRequest -Uri "https://github.com/sharkdp/hyperfine/releases/download/v$version/$asset" -OutFile $zip
          $expected = '2508c549b049b1d4342d08edc1cb42bfac169082b6e3069431b5bab9822dbb32'
          $actual = (Get-FileHash -Algorithm SHA256 -Path $zip).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "hyperfine: checksum mismatch for $asset ($actual)"
          }
          $dir = Join-Path $env:RUNNER_TEMP "hyperfine-$version"
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          $binary = Join-Path $dir "hyperfine-v$version-x86_64-pc-windows-msvc/hyperfine.exe"
          Add-Content -Path $env:GITHUB_PATH -Value (Split-Path $binary)
          & $binary --version

      - name: Install jq (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Get-Command jq -ErrorAction SilentlyContinue) {
            jq --version
            exit 0
          }
          $version = '1.7.1'
          $asset = 'jq-windows-amd64.exe'
          $exe = Join-Path $env:RUNNER_TEMP $asset
          Invoke-WebRequest -Uri "https://github.com/jqlang/jq/releases/download/jq-$version/$asset" -OutFile $exe
          $expected = '7451fbbf37feffb9bf262bd97c54f0da558c63f0748e64152dd87b0a07b6d6ab'
          $actual = (Get-FileHash -Algorithm SHA256 -Path $exe).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "jq: checksum mismatch for $asset ($actual)"
          }
          $dir = Join-Path $env:RUNNER_TEMP "jq-$version"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Move-Item -Path $exe -Destination (Join-Path $dir 'jq.exe')
          Add-Content -Path $env:GITHUB_PATH -Value $dir
          & (Join-Path $dir 'jq.exe') --version

      - name: Verify (bash)
        shell: bash
        env:
          BUDGET_MS: ${{ matrix.budget_ms }}
          STARTUP_BUDGET_ENFORCE: ${{ matrix.budget_enforce }}
        run: bash scripts/verify.sh

      - name: Gate self-tests
        shell: bash
        run: bash scripts/gate-tests.sh

      - name: Memory checks (ADR-0009)
        shell: bash
        env:
          MEMORY_GATE_MB: ${{ matrix.memory_gate_mb }}
        run: bash scripts/memory.sh ci

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verify-${{ matrix.rid }}
          path: |
            artifacts/
            .artifacts/
          if-no-files-found: warn

  # The prose leg: markdownlint, the generated-region check, the "docs are not build inputs" guard and
  # `openspec validate --all --strict`. No .NET, no build, no tests -- which is the point: a proposal
  # or a page cannot be reddened by an unrelated flake in a suite it never runs.
  verify-docs:
    name: verify-docs
    needs: plan
    if: needs.plan.outputs.profile == 'docs'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The gate pins the CLI version it was checked against; the flake that ships with a runner is
      # not that version.
      - name: Install openspec
        shell: bash
        run: |
          set -euo pipefail
          npm install --global --prefix "${RUNNER_TEMP}/openspec" @fission-ai/openspec@1.14.0
          echo "${RUNNER_TEMP}/openspec/bin" >>"${GITHUB_PATH}"

      - name: Verify (docs profile)
        shell: bash
        run: bash scripts/verify.sh --profile docs

  # The Windows PowerShell gate runs as its own job so it proceeds in parallel
  # with the bash matrix. Running it sequentially on the same runner made
  # Windows the ~16m critical path (bash ~9m40s + pwsh ~5m50s); in parallel the
  # pipeline lands around ~10m while both gates still run on every PR.
  verify-powershell:
    name: verify-powershell (windows)
    needs: plan
    if: needs.plan.outputs.profile == 'full'
    runs-on: windows-latest
    env:
      RID: win-x64
      BUDGET_MS: 350
      # English-first CI logs (same rationale as the matrix job).
      DOTNET_CLI_UI_LANGUAGE: en
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The public-API step diffs PublicAPI.Shipped.txt against the merge
          # base with origin/main; PR checkouts are shallow and lack origin/main,
          # so fetch full history.
          fetch-depth: 0
        # Force LF checkout: the public-API step diffs tracked
        # *PublicAPI.Shipped.txt files, so autocrlf rewrites would show as noise.
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: "false"

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            global.json
            Directory.Build.props
            **/*.csproj

      - name: Install hyperfine (Windows)
        shell: pwsh
        run: |
          $version = '1.20.0'
          $asset = "hyperfine-v$version-x86_64-pc-windows-msvc.zip"
          $zip = Join-Path $env:RUNNER_TEMP $asset
          Invoke-WebRequest -Uri "https://github.com/sharkdp/hyperfine/releases/download/v$version/$asset" -OutFile $zip
          $expected = '2508c549b049b1d4342d08edc1cb42bfac169082b6e3069431b5bab9822dbb32'
          $actual = (Get-FileHash -Algorithm SHA256 -Path $zip).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "hyperfine: checksum mismatch for $asset ($actual)"
          }
          $dir = Join-Path $env:RUNNER_TEMP "hyperfine-$version"
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          $binary = Join-Path $dir "hyperfine-v$version-x86_64-pc-windows-msvc/hyperfine.exe"
          Add-Content -Path $env:GITHUB_PATH -Value (Split-Path $binary)
          & $binary --version

      - name: Verify (PowerShell)
        shell: pwsh
        run: ./scripts/verify.ps1

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verify-win-x64-powershell
          path: artifacts/
          if-no-files-found: warn

  # The dedicated cold-startup leg (#240). The floor measured inside verify is still noisy on
  # the shared macOS runner: across 29 successful `main` runs (2026-10-28/29, post-#135,
  # post-ADR-0005 floor gate) the macOS floor read 77-275 ms, p95 256 ms against a 300 ms
  # budget — a bimodal runner, not a binary change — while Ubuntu (26-41 ms) and Windows
  # (60-139 ms) stayed tight. So the measurement gets its own quiet job: restore, build
  # Release, publish, run scripts/perf.sh, nothing else. Budgets are unchanged (ADR-0005);
  # do not raise them here. The verify legs keep measuring startup after their publish —
  # the verify gate's behaviour is intact; this leg adds an independent, quiet measurement
  # on the runner class the evidence named. A quiet Ubuntu or windows measurement is what
  # the same evidence showed, so those legs are not duplicated here; add a matrix entry
  # below only when a runner's numbers ask for it.
  perf:
    name: perf (${{ matrix.os }})
    needs: plan
    if: needs.plan.outputs.profile == 'full'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            rid: osx-arm64
            budget_ms: 300
    env:
      RID: ${{ matrix.rid }}
      DOTNET_CLI_UI_LANGUAGE: en
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            global.json
            Directory.Build.props
            **/*.csproj

      - name: Install hyperfine (macOS)
        run: |
          set -euo pipefail
          brew install hyperfine
          hyperfine --version
          jq --version

      # Build and publish what verify.sh's startup step measures — same configuration, same
      # publish flags (ADR-0008 release shape) — on a runner that runs nothing else first.
      - name: Build (Release)
        run: dotnet build lunate.slnx -c Release --nologo

      - name: Publish
        run: |
          dotnet publish src/Lunate.Coding/Lunate.Coding.csproj \
            -c Release \
            -r "${{ matrix.rid }}" \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:PublishReadyToRun=true \
            -o "artifacts/publish/${{ matrix.rid }}" \
            --nologo

      - name: Startup budget (dedicated measurement)
        env:
          BUDGET_MS: ${{ matrix.budget_ms }}
        run: bash scripts/perf.sh "artifacts/publish/${{ matrix.rid }}/lunate"

  # Single aggregate check for branch protection: the ruleset requires only
  # "ci-ok", so renaming, adding or removing a matrix leg cannot silently drop
  # a required check. always() so a failed leg produces a definitive red
  # instead of a skipped (missing) check; skipped or cancelled legs are not
  # success. No path filters exist on pull_request, so no path filter can
  # leave this check pending on a PR; new top-level verification jobs must be
  # added to "needs" here to stay covered.
  #
  # The plan decides WHICH legs run; this job decides whether the run that
  # actually happened counts as success, and it fails closed on a profile it
  # cannot read. The legs the profile does not select must be skipped, not
  # green: a docs plan that also ran the full matrix means the plan lied.
  #
  # This job must never be skipped on a draft: branch protection reads a
  # skipped required check as satisfied, so a head whose only run was the draft
  # run would show "All checks have passed" with no gate behind it. The draft
  # check is a failing step in scripts/ci-ok.sh instead -- a failure cannot
  # satisfy a required context -- while `plan` keeps its draft gate so a draft
  # push still costs no matrix. scripts/ci-ok.sh --self-test pins both halves.
  ci-ok:
    name: ci-ok
    needs: [plan, verify, verify-powershell, verify-docs, perf]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Every required job succeeded
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
          PLAN: ${{ needs.plan.result }}
          PROFILE: ${{ needs.plan.outputs.profile }}
          VERIFY: ${{ needs.verify.result }}
          POWERSHELL: ${{ needs.verify-powershell.result }}
          DOCS: ${{ needs.verify-docs.result }}
          PERF: ${{ needs.perf.result }}
        run: bash scripts/ci-ok.sh
