name: CI

on:
  push:
    branches: [main]
    # Tags belong to the Release workflow, which runs the release gate and publishes. CI must not
    # run on a tag: a tag push would leave a second `ci-ok` verdict -- and a red one -- on the
    # commit it tags, even though the branch push already gated that commit (#724).
    # Docs/spec-only pushes skip CI (they cannot break the build). A push that
    # touches any code or workflow file still runs the full matrix; docs-only
    # pushes are linted by the docs-lint workflow instead.
    paths-ignore:
      - 'docs/**'
      - 'adr/**'
      - 'openspec/**'
      - '*.md'
  pull_request:
    # ready_for_review is not in GitHub's default set: without it, a draft that
    # is marked ready would keep the statuses of the run it had as a draft.
    types: [opened, synchronize, reopened, ready_for_review]
  # The merge queue runs the required check on the combined head of a batch. Without this trigger
  # `ci-ok` never reports for a merge group and the queue stalls.
  merge_group:
  # The nightly run keeps the path-filtered PowerShell leg honest: a Windows-only regression that
  # arrives through a path the filter does not name still lands within a day, not at the next tag.
  # A red nightly files its own issue (kind/bug, 0.3) so it cannot sit unnoticed.
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      verify_shard_count:
        description: "Verify shards per OS (1 for the baseline, 4 for the sharded run)."
        required: true
        type: choice
        options: ["1", "2", "3", "4"]
        default: "4"

# Supersede in-flight runs only for the same obligation: a pull-request push makes the pull
# request's previous run obsolete, while a push to main and a merge-group gate each need their own
# completed verdict. The nightly runs on the same branch as a push, so it gets its own group and
# cancels nothing (#705). A draft and a ready pull-request run are separate obligations: a draft
# push still costs no matrix, and it must never cancel the ready run whose gate proves the head
# (#830). Within a group, a newer run of the same obligation still supersedes the older one.
concurrency:
  group: ci-${{ github.ref }}${{ github.event_name == 'schedule' && '-nightly' || '' }}${{ github.event_name == 'pull_request' && github.event.pull_request.draft && '-draft' || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Which gate this change needs. Prose (docs, ADRs, OpenSpec proposals/specs, root Markdown) cannot
  # break the build, so it gets the three-minute docs profile; anything else -- including any change
  # to this workflow -- gets the full matrix. The rule lives in scripts/ci-plan.sh, deny-by-default,
  # and its self-test runs here so a broken plan cannot silently downgrade a code pull request.
  plan:
    name: plan
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    outputs:
      profile: ${{ steps.decide.outputs.profile }}
      macos: ${{ steps.legs.outputs.macos }}
      verify_matrix: ${{ steps.legs.outputs.verify_matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The decision diffs the pull request against its base, so the history has to be there.
          fetch-depth: 0

      - name: Tooling self-tests
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci-plan.sh --self-test
          bash scripts/ci-ok.sh --self-test
          bash scripts/ci-powershell-paths.sh --self-test
          python3 scripts/docs-sync --self-test
          python3 scripts/docs-check --self-test
          bash scripts/no-docs-references.sh --self-test
          bash scripts/no-wip-commits.sh --self-test
          bash scripts/nightly-issue.sh --self-test

      # A wip commit is the queue driver's safety net for a stalled session: it preserves work that
      # would otherwise be lost, and it belongs in a draft. This job only runs for a pull request
      # that is ready for review, so reaching it with a wip subject means the draft flag came off
      # before the commit was rewritten -- the one thing the safety net must never allow.
      - name: No wip commits in a ready pull request
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash scripts/no-wip-commits.sh

      - name: Decide the profile
        id: decide
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "merge_group" ]; then
            # The batch is judged by what it changes against the branch it will land on, exactly as
            # a pull request is: a batch of prose-only pull requests gets the docs profile.
            git diff --name-status -M "${BASE_SHA}...HEAD" >changed.txt
            echo "changed paths (merge group):"
            cat changed.txt
            bash scripts/ci-plan.sh --paths-file changed.txt >>"${GITHUB_OUTPUT}"
            cat "${GITHUB_OUTPUT}"
            exit 0
          fi
          if [ "${GITHUB_EVENT_NAME}" != "pull_request" ]; then
            # A push to main already filters prose-only changes (paths-ignore above), so whatever
            # arrives here gets the whole gate.
            echo "not a pull request: the full gate runs"
            echo "profile=full" >>"${GITHUB_OUTPUT}"
            exit 0
          fi
          git diff --name-status -M "origin/${BASE_REF}...HEAD" >changed.txt
          echo "changed paths:"
          cat changed.txt
          bash scripts/ci-plan.sh --paths-file changed.txt >>"${GITHUB_OUTPUT}"
          cat "${GITHUB_OUTPUT}"

      # The verify job's matrix, sized by the event (#831): a pull request proves the change on
      # Ubuntu only, a merge group runs the same Ubuntu shards without repeating the PR's cheap
      # checks, and the full three-OS matrix belongs to a push to main, the nightly and a manual
      # dispatch. Ubuntu and Windows run the dispatch's shard count (four unless a manual dispatch
      # picks another); macOS runs two. The free plan runs five macOS jobs at once, so four per
      # pull-request run plus four per merge-queue group left shards cancelled without a runner,
      # which ejected green pull requests from the queue (#831). ci-ok reads `macos` and requires
      # the full matrix only on the events that own it.
      #
      # budget_ms: calibrated in spike S-3 (docs/dev/spikes/S-3/report.md, ADR 0005 accepted
      # 2026-10-04) -- runner startup median + ~50% headroom, rounded up to 50 ms. Re-calibrate when a
      # runner image or baseline shifts. The local default in scripts/perf.sh stays 150 ms.
      # memory_gate_mb: idle peak-RSS gate (MB) per OS (ADR 0009); provisional 150 until the T-18 TUI
      # subject exists (report-only until then).
      # The shared macOS runner's floor is bimodal (~80-240 ms quiet, ~310-330 ms loaded), so a breach
      # there is measured and printed, not fatal (budget_enforce 0); `perf (macos-latest)` enforces
      # the budget on a leg that runs nothing else.
      - name: Decide the verify legs
        id: legs
        shell: bash
        env:
          SHARDS: ${{ inputs.verify_shard_count || '4' }}
        run: |
          set -euo pipefail
          case "${SHARDS}" in
            1 | 2 | 3 | 4) ;;
            *)
              echo "::error::verify_shard_count must be 1 to 4, got '${SHARDS}'"
              exit 1
              ;;
          esac
          macos_shards=$((SHARDS < 2 ? SHARDS : 2))
          case "${GITHUB_EVENT_NAME}" in
            # The fast gate and the merge queue are Ubuntu-only: the full matrix runs where a merge
            # is already behind it, not twice on the same diff.
            pull_request | merge_group) macos=false ;;
            *) macos=true ;;
          esac
          legs=""
          # os, rid, budget_ms, memory_gate_mb, shard count, extra JSON fields
          leg() {
            local shard
            for ((shard = 1; shard <= $5; shard++)); do
              legs+="${legs:+,}{\"os\":\"$1\",\"rid\":\"$2\",\"budget_ms\":$3,\"memory_gate_mb\":$4,\"shard\":${shard},\"shard_count\":$5$6}"
            done
          }
          leg ubuntu-latest linux-x64 250 150 "${SHARDS}" ""
          if [ "${macos}" = true ]; then
            leg macos-latest osx-arm64 300 150 "${macos_shards}" ',"budget_enforce":0'
            leg windows-latest win-x64 350 150 "${SHARDS}" ""
          fi
          {
            echo "macos=${macos}"
            echo "verify_matrix={\"include\":[${legs}]}"
          } | tee -a "${GITHUB_OUTPUT}"

  # Which legs the changed paths actually touch. Today that is one question -- does the Windows
  # PowerShell leg have to run? -- but it lives in a job of its own so ci-ok can tell a legitimate
  # skip (the paths did not match) from a missing one (they did). The decision itself is in
  # scripts/ci-powershell-paths.sh: deny-by-default, with the Windows-specific source list derived
  # from the code's own markers rather than a hand-kept list of files.
  changes:
    name: changes
    # A merge group skips this: its pull requests already proved their path decisions, and there is
    # no later leg in the queue for the PowerShell decision to feed.
    if: (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    outputs:
      powershell: ${{ steps.powershell.outputs.powershell }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The decision diffs the pull request against its base, so the history has to be there.
          fetch-depth: 0

      - name: Does the PowerShell leg need to run?
        id: powershell
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          case "${EVENT_NAME}" in
            pull_request | merge_group) ;;
            *)
              # A push, a manual dispatch or the nightly run always exercises the Windows gate.
              echo "not a pull request: the PowerShell leg runs"
              echo "powershell=true" >>"${GITHUB_OUTPUT}"
              exit 0
              ;;
          esac
          if [ "${EVENT_NAME}" = "merge_group" ]; then
            git diff --name-status -M "${BASE_SHA}...HEAD" >changed.txt
          else
            git diff --name-status -M "origin/${BASE_REF}...HEAD" >changed.txt
          fi
          cat changed.txt
          bash scripts/ci-powershell-paths.sh --paths-file changed.txt >>"${GITHUB_OUTPUT}"
          cat "${GITHUB_OUTPUT}"

  # The changelog rule: a pull request writes its release-note line in changes/<number>.md and never
  # edits CHANGELOG.md; only the release pull request (branch release/<version> or a title starting
  # chore(release)) assembles it. This runs whatever profile was chosen, because a prose pull request
  # is exactly the one that used to edit the changelog. When the diff includes CHANGELOG.md -- the
  # release pull request -- the same job runs the assembler's --check, so the assembly the release
  # commits is verified by the run that uses it.
  changelog:
    name: changelog
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The decision diffs the pull request against its base, so the history has to be there.
          fetch-depth: 0

      - name: Only the release pull request edits CHANGELOG.md
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          git diff --name-status -M "origin/${BASE_REF}...HEAD" >changed.txt
          echo "changed paths:"
          cat changed.txt
          python3 scripts/changelog-guard --self-test
          # The rule is inert until changes/ exists on the base: the pull request that introduces
          # the directory would otherwise be refused a changelog edit with nowhere else to put the
          # line. That is exactly the one pull request that seeds the directory and the region.
          if ! git cat-file -e "origin/${BASE_REF}:changes/README.md" 2>/dev/null; then
            echo "changelog: changes/ is not on ${BASE_REF} yet, so the rule is inert for this pull request"
            exit 0
          fi
          python3 scripts/changelog-guard --paths-file changed.txt \
            --pull-request "${PR_NUMBER}" --branch "${HEAD_REF}" --title "${TITLE}"
          if grep -qE '(^|[[:space:]])CHANGELOG\.md$' changed.txt; then
            python3 scripts/changelog-assemble --check
          fi

  # The cheap repository-wide checks -- ADR numbering, the spec-archive rule, the generated docs
  # regions, the docs link/navigation check and the docs lint -- on the tree the queue is about to
  # land. Each pull request proved only its own tree against its own base (#840 took a free ADR-0036
  # while #843's full-profile gate never asked about ADR numbers), so the batch that combined them was
  # the first tree to carry a duplicate and nothing in the queue ran the check that catches it
  # (#854). The push to `main` runs the same script in `tree-checks.yml`; a pull request keeps the
  # checks its profile already carries. `scripts/tree-checks.sh` holds the one command list.
  tree-checks:
    name: tree-checks
    # Only the queue needs its own copy: a push to `main` has `tree-checks.yml` (a docs-only push
    # skips this workflow entirely), and a pull request runs the checks through its profile.
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # `check-spec-archive.py` diffs the batch against the queue's base commit, which a shallow
          # clone does not carry, and the version region in README.md is derived from the release
          # tags, which a shallow checkout does not fetch either.
          fetch-depth: 0
          fetch-tags: true

      # No .NET, no build, no test: seconds of wall clock, which is why the queue can afford them.
      - name: Tree checks
        shell: bash
        env:
          # The batch's own range: the commit it would land on, to the combined head. The ADR
          # numbering check reads the whole tree, so it sees a duplicate whichever queued pull
          # request introduced it.
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          echo "checking the batch's range ${BASE_SHA}...HEAD"
          bash scripts/tree-checks.sh --base "${BASE_SHA}"

  # The platform-independent half of the gate: formatting, the generated docs regions, markdownlint,
  # the public API, the OpenSpec tree and the two agent-hygiene checks. Running it once on Linux is
  # the point -- a Windows runner formatting the same source as a macOS runner was cost, not depth.
  # The OS legs skip these steps (VERIFY_SKIP_PLATFORM_CHECKS=1) and keep build, test, publish and
  # the artifact proofs, which genuinely differ per OS. A merge group skips this job too: its pull
  # requests ran the same checks on the same tree.
  platform:
    name: platform
    needs: plan
    if: needs.plan.outputs.profile == 'full' && github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The public-API step diffs PublicAPI.Shipped.txt against the merge base with origin/main.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            global.json
            Directory.Build.props
            **/*.csproj

      # `dotnet format --no-restore` needs the assets files; a restore is enough, no build.
      - name: Restore
        shell: bash
        run: dotnet restore lunate.slnx --nologo

      # The gate pins the CLI version it was checked against; the flake that ships with a runner is
      # not that version.
      - name: Install openspec
        shell: bash
        run: |
          set -euo pipefail
          npm install --global --prefix "${RUNNER_TEMP}/openspec" @fission-ai/openspec@1.14.0
          echo "${RUNNER_TEMP}/openspec/bin" >>"${GITHUB_PATH}"

      - name: Platform checks
        shell: bash
        run: bash scripts/verify.sh --profile platform

  verify:
    name: verify (${{ matrix.os }}, ${{ matrix.shard }}/${{ matrix.shard_count }})
    needs: plan
    if: needs.plan.outputs.profile == 'full'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # The legs and their shards come from the plan job (`Decide the verify legs`): Ubuntu and
      # Windows run four shards on every event, macOS two and not on a pull request. The test phase
      # is sharded per OS (#696, building on #390): verify.sh's --shard i/n partitions the
      # solution's test projects by position, and each shard runs its slice of both culture passes.
      # Shard 1 also owns every non-test step (publish, budgets, roundtrips, format, docs checks,
      # public API); a shard > 1 runs only the build it needs plus its test slice. The ruleset
      # requires ci-ok, and ci-ok requires the verify job, which fails on any failed shard. Manual
      # dispatch can compare --shard 1/1 with the sharded run on the same commit.
      matrix: ${{ fromJSON(needs.plan.outputs.verify_matrix) }}
    env:
      RID: ${{ matrix.rid }}
      # The platform-independent checks (format, docs, public API, Openspec) run once in the
      # `platform` job; this leg does build, test, publish and the artifact proofs.
      VERIFY_SKIP_PLATFORM_CHECKS: "1"
      # English-first CI logs: pin the dotnet CLI / test-runner UI text. The
      # de-AT culture pass still sets the test culture via LANG; only UI
      # strings are pinned (defense in depth over scripts/verify.*).
      DOTNET_CLI_UI_LANGUAGE: en
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The public-API step diffs PublicAPI.Shipped.txt against the merge
          # base with origin/main; PR checkouts are shallow and lack origin/main,
          # so fetch full history.
          fetch-depth: 0
        # Force LF checkout on windows: the public-API step diffs tracked
        # *PublicAPI.Shipped.txt files, so autocrlf rewrites would show as noise.
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: "false"

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            global.json
            Directory.Build.props
            **/*.csproj

      # The de-AT culture pass runs under LC_ALL=de_AT.UTF-8. The ubuntu runner
      # image does not ship that locale, so bash children warn to stderr
      # ("setlocale: LC_ALL: cannot change locale"), which tests that capture a
      # child's stderr exactly would see. Generate it so the pass is faithful.
      - name: Generate de_AT locale (Linux)
        if: runner.os == 'Linux'
        run: sudo locale-gen de_AT.UTF-8

      # The bash guard's platform matrix: the Linux leg runs the bubblewrap refusal (or, when the
      # runtime refuses user namespaces — Ubuntu AppArmor — the detection notice) for real.
      # ADR 0024.
      - name: Install bubblewrap (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends bubblewrap
          bwrap --version

      # The container tool runner's end-to-end test drives the runner's real Docker engine; pull the
      # image once here so the test proves the container path rather than a registry round trip. The
      # test skips with a visible reason wherever no engine is reachable (the macOS and Windows legs).
      - name: Pull the container end-to-end image (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          docker pull ubuntu:24.04
          docker image inspect ubuntu:24.04 >/dev/null

      - name: Install hyperfine (Linux)
        if: runner.os == 'Linux' && matrix.shard == 1
        run: |
          set -euo pipefail
          version=1.20.0
          asset="hyperfine-v${version}-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSL -o "${RUNNER_TEMP}/${asset}" \
            "https://github.com/sharkdp/hyperfine/releases/download/v${version}/${asset}"
          printf '%s  %s\n' \
            3285ec7959285288137043dd81dce0dde056227018a8277532d9a364b4f03c2b \
            "${RUNNER_TEMP}/${asset}" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/${asset}" -C "${RUNNER_TEMP}"
          install "${RUNNER_TEMP}/hyperfine-v${version}-x86_64-unknown-linux-musl/hyperfine" \
            /usr/local/bin/hyperfine
          hyperfine --version

      - name: Install hyperfine (macOS)
        if: runner.os == 'macOS' && matrix.shard == 1
        run: |
          set -euo pipefail
          brew install hyperfine
          hyperfine --version

      - name: Install hyperfine (Windows)
        if: runner.os == 'Windows' && matrix.shard == 1
        shell: pwsh
        run: |
          $version = '1.20.0'
          $asset = "hyperfine-v$version-x86_64-pc-windows-msvc.zip"
          $zip = Join-Path $env:RUNNER_TEMP $asset
          Invoke-WebRequest -Uri "https://github.com/sharkdp/hyperfine/releases/download/v$version/$asset" -OutFile $zip
          $expected = '2508c549b049b1d4342d08edc1cb42bfac169082b6e3069431b5bab9822dbb32'
          $actual = (Get-FileHash -Algorithm SHA256 -Path $zip).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "hyperfine: checksum mismatch for $asset ($actual)"
          }
          $dir = Join-Path $env:RUNNER_TEMP "hyperfine-$version"
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          $binary = Join-Path $dir "hyperfine-v$version-x86_64-pc-windows-msvc/hyperfine.exe"
          Add-Content -Path $env:GITHUB_PATH -Value (Split-Path $binary)
          & $binary --version

      - name: Install jq (Windows)
        if: runner.os == 'Windows' && matrix.shard == 1
        shell: pwsh
        run: |
          if (Get-Command jq -ErrorAction SilentlyContinue) {
            jq --version
            exit 0
          }
          $version = '1.7.1'
          $asset = 'jq-windows-amd64.exe'
          $exe = Join-Path $env:RUNNER_TEMP $asset
          Invoke-WebRequest -Uri "https://github.com/jqlang/jq/releases/download/jq-$version/$asset" -OutFile $exe
          $expected = '7451fbbf37feffb9bf262bd97c54f0da558c63f0748e64152dd87b0a07b6d6ab'
          $actual = (Get-FileHash -Algorithm SHA256 -Path $exe).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "jq: checksum mismatch for $asset ($actual)"
          }
          $dir = Join-Path $env:RUNNER_TEMP "jq-$version"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Move-Item -Path $exe -Destination (Join-Path $dir 'jq.exe')
          Add-Content -Path $env:GITHUB_PATH -Value $dir
          & (Join-Path $dir 'jq.exe') --version

      - name: Verify (bash)
        shell: bash
        env:
          BUDGET_MS: ${{ matrix.budget_ms }}
          STARTUP_BUDGET_ENFORCE: ${{ matrix.budget_enforce }}
        run: bash scripts/verify.sh --shard "${{ matrix.shard }}/${{ matrix.shard_count }}"

      # Every shard records its own wall time (scripts/shard-timing.sh, called from verify.sh)
      # so the next shard-count change can see which leg is the pole after one real run.
      - name: Upload shard timing
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verify-timing-${{ matrix.rid }}-${{ matrix.shard }}-of-${{ matrix.shard_count }}
          path: artifacts/verify-timing/
          if-no-files-found: warn
          retention-days: 14

      # The gate's own self-tests need the published binary (perf and the shipped-API
      # fixture), which only shard 1 produces; the test slices of shards > 1 prove the
      # partition, and gate-tests.sh itself runs in full here.
      - name: Gate self-tests
        if: matrix.shard == 1
        shell: bash
        run: bash scripts/gate-tests-retry.sh

      - name: Memory checks (ADR-0009)
        if: matrix.shard == 1
        shell: bash
        env:
          MEMORY_GATE_MB: ${{ matrix.memory_gate_mb }}
        run: bash scripts/memory.sh ci

      - name: Upload verification artifacts
        if: always() && matrix.shard == 1
        uses: actions/upload-artifact@v7
        with:
          name: verify-${{ matrix.rid }}
          path: |
            artifacts/
            .artifacts/
          if-no-files-found: warn

  # The prose leg: markdownlint, the generated-region check, the "docs are not build inputs" guard and
  # `openspec validate --all --strict`. No .NET, no build, no tests -- which is the point: a proposal
  # or a page cannot be reddened by an unrelated flake in a suite it never runs.
  verify-docs:
    name: verify-docs
    needs: plan
    # The pull request already ran the docs profile; a merge group has nothing left to lint.
    if: needs.plan.outputs.profile == 'docs' && github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The docs profile compares changed paths with origin/main; a shallow
          # checkout does not create that remote-tracking ref.
          fetch-depth: 0

      # The gate pins the CLI version it was checked against; the flake that ships with a runner is
      # not that version.
      - name: Install openspec
        shell: bash
        run: |
          set -euo pipefail
          npm install --global --prefix "${RUNNER_TEMP}/openspec" @fission-ai/openspec@1.14.0
          echo "${RUNNER_TEMP}/openspec/bin" >>"${GITHUB_PATH}"

      - name: Verify (docs profile)
        shell: bash
        run: bash scripts/verify.sh --profile docs

  # The Windows PowerShell gate runs as its own job so it proceeds in parallel
  # with the bash matrix. It is part of the full matrix now, so it runs on a push
  # to main, the nightly and a manual dispatch rather than on every PR (#831).
  verify-powershell:
    name: verify-powershell (windows)
    needs: [plan, changes]
    # The Windows twin belongs to the full matrix: a push to main, the nightly and a manual
    # dispatch. A pull request and a merge group run Ubuntu only, so Windows flakiness cannot
    # eject a green change from the queue.
    if: needs.plan.outputs.profile == 'full' && needs.changes.outputs.powershell == 'true' && github.event_name != 'pull_request' && github.event_name != 'merge_group'
    runs-on: windows-latest
    env:
      RID: win-x64
      BUDGET_MS: 350
      # Formatting, docs lint and the public-API diff run once in the platform job; this leg
      # skips the second copy (#435). A local Windows verify.ps1 keeps the full gate.
      VERIFY_SKIP_PLATFORM_CHECKS: "1"
      # English-first CI logs (same rationale as the matrix job).
      DOTNET_CLI_UI_LANGUAGE: en
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The public-API step diffs PublicAPI.Shipped.txt against the merge
          # base with origin/main; PR checkouts are shallow and lack origin/main,
          # so fetch full history.
          fetch-depth: 0
        # Force LF checkout: the public-API step diffs tracked
        # *PublicAPI.Shipped.txt files, so autocrlf rewrites would show as noise.
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: "false"

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            global.json
            Directory.Build.props
            **/*.csproj

      - name: PowerShell test-runner self-tests
        shell: pwsh
        run: ./scripts/verify-test-runner.tests.ps1

      - name: Install hyperfine (Windows)
        shell: pwsh
        run: |
          $version = '1.20.0'
          $asset = "hyperfine-v$version-x86_64-pc-windows-msvc.zip"
          $zip = Join-Path $env:RUNNER_TEMP $asset
          Invoke-WebRequest -Uri "https://github.com/sharkdp/hyperfine/releases/download/v$version/$asset" -OutFile $zip
          $expected = '2508c549b049b1d4342d08edc1cb42bfac169082b6e3069431b5bab9822dbb32'
          $actual = (Get-FileHash -Algorithm SHA256 -Path $zip).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "hyperfine: checksum mismatch for $asset ($actual)"
          }
          $dir = Join-Path $env:RUNNER_TEMP "hyperfine-$version"
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          $binary = Join-Path $dir "hyperfine-v$version-x86_64-pc-windows-msvc/hyperfine.exe"
          Add-Content -Path $env:GITHUB_PATH -Value (Split-Path $binary)
          & $binary --version

      - name: Verify (PowerShell)
        shell: pwsh
        run: ./scripts/verify.ps1

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verify-win-x64-powershell
          path: |
            artifacts/
            .artifacts/
          if-no-files-found: warn

  # The dedicated cold-startup leg (#240). The floor measured inside verify is still noisy on
  # the shared macOS runner: across 29 successful `main` runs (2026-10-28/29, post-#135,
  # post-ADR-0005 floor gate) the macOS floor read 77-275 ms, p95 256 ms against a 300 ms
  # budget — a bimodal runner, not a binary change — while Ubuntu (26-41 ms) and Windows
  # (60-139 ms) stayed tight. So the measurement gets its own quiet job: restore, build
  # Release, publish, run scripts/perf.sh, nothing else. Budgets are unchanged (ADR-0005);
  # do not raise them here. The verify legs keep measuring startup after their publish —
  # the verify gate's behaviour is intact; this leg adds an independent, quiet measurement
  # on the runner class the evidence named. A quiet Ubuntu or windows measurement is what
  # the same evidence showed, so those legs are not duplicated here; add a matrix entry
  # below only when a runner's numbers ask for it.
  perf:
    name: perf (${{ matrix.os }})
    needs: plan
    # The startup budget is a nightly trend and a push-to-main measurement here; the Release
    # workflow's own gate measures it for a tag. A push to main must never go red on it: a shared
    # runner varies by a few percent, and a 4% overrun (311 ms against a 300 ms budget) ejected a
    # whole batch from the merge queue when a batch measured it. The queue and the fast gate do not
    # run it, the per-PR verify shards keep enforcing the budget through STARTUP_BUDGET_ENFORCE, and
    # the nightly's perf result feeds its verdict.
    if: needs.plan.outputs.profile == 'full' && (github.event_name == 'schedule' || github.event_name == 'push')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            rid: osx-arm64
            budget_ms: 300
    env:
      RID: ${{ matrix.rid }}
      DOTNET_CLI_UI_LANGUAGE: en
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            global.json
            Directory.Build.props
            **/*.csproj

      - name: Install hyperfine (macOS)
        run: |
          set -euo pipefail
          brew install hyperfine
          hyperfine --version
          jq --version

      # Build and publish what verify.sh's startup step measures — same configuration, same
      # publish flags (ADR-0008 release shape) — on a runner that runs nothing else first.
      - name: Build (Release)
        run: dotnet build lunate.slnx -c Release --nologo

      - name: Publish
        run: |
          dotnet publish src/Lunate.Coding/Lunate.Coding.csproj \
            -c Release \
            -r "${{ matrix.rid }}" \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:PublishReadyToRun=true \
            -o "artifacts/publish/${{ matrix.rid }}" \
            --nologo

      - name: Startup budget (dedicated measurement)
        env:
          BUDGET_MS: ${{ matrix.budget_ms }}
        run: bash scripts/perf.sh "artifacts/publish/${{ matrix.rid }}/lunate"

  # A red nightly is the safety net for everything the fast gate and the merge queue no longer run:
  # Windows, macOS, the PowerShell twin and the perf measurement. It files its own kind/bug card per
  # failing job so a regression cannot sit unnoticed until the next tag, and the next red night for
  # the same job comments on the open card instead of filing a duplicate. The report reads the run's
  # jobs through the API rather than `needs`, because `needs.verify` collapses the matrix to one
  # result and the card must name the leg. scripts/nightly-issue.sh owns the decision; its self-test
  # runs in `plan` with a stubbed gh.
  nightly-issue:
    name: nightly-issue
    needs: [plan, changes, verify, verify-powershell, platform, verify-docs, perf, changelog]
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read the run's jobs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100" \
            >"${RUNNER_TEMP}/jobs.json"

      - name: File one card per failing job
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          bash scripts/nightly-issue.sh \
            --jobs-json "${RUNNER_TEMP}/jobs.json" \
            --repo "${GITHUB_REPOSITORY}" \
            --run-url "${RUN_URL}" \
            --commit "${GITHUB_SHA}"

  # Single aggregate check for branch protection: the ruleset requires only
  # "ci-ok", so renaming, adding or removing a matrix leg cannot silently drop
  # a required check. always() so a failed leg produces a definitive red
  # instead of a skipped (missing) check; skipped or cancelled legs are not
  # success. No path filters exist on pull_request, so no path filter can
  # leave this check pending on a PR; new top-level verification jobs must be
  # added to "needs" here to stay covered. `nightly-issue` is deliberately not
  # a needed job: it reports a red night, it is not a gate.
  #
  # The plan decides WHICH legs and which matrix the event needs; this job decides whether the run
  # that actually happened is that gate, and it fails closed on a profile it cannot read. The legs
  # the event and profile do not select must be skipped, not green: a full matrix on a pull request,
  # or a docs job in a merge group, means the plan lied (#831). The event table lives in
  # scripts/ci-ok.sh, whose self-test covers the pull request, merge group and push/nightly sets.
  #
  # This job must never be skipped on a draft: branch protection reads a
  # skipped required check as satisfied, so a head whose only run was the draft
  # run would show "All checks have passed" with no gate behind it. The draft
  # check is a failing step in scripts/ci-ok.sh instead -- a failure cannot
  # satisfy a required context -- while `plan` keeps its draft gate so a draft
  # push still costs no matrix. scripts/ci-ok.sh --self-test pins both halves.
  #
  # A pull request is judged from the live head, not this run's payload: ci-ok
  # reads the pull request and its live head's check runs through the API, so a
  # rerun of an older or draft run cannot override the ready run's verdict
  # (#815), and a cancelled draft run cannot hide it (#816). The `needs` results
  # below still drive every other event, including a merge_group run.
  ci-ok:
    name: ci-ok
    needs: [plan, changes, verify, verify-powershell, platform, verify-docs, perf, changelog, tree-checks]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      checks: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Every required job succeeded
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PLAN: ${{ needs.plan.result }}
          PROFILE: ${{ needs.plan.outputs.profile }}
          MACOS: ${{ needs.plan.outputs.macos }}
          VERIFY: ${{ needs.verify.result }}
          POWERSHELL: ${{ needs.verify-powershell.result }}
          PS_REQUIRED: ${{ needs.changes.outputs.powershell }}
          CHANGES: ${{ needs.changes.result }}
          DOCS: ${{ needs.verify-docs.result }}
          PERF: ${{ needs.perf.result }}
          PLATFORM: ${{ needs.platform.result }}
          TREE: ${{ needs.tree-checks.result }}
          FRAGMENTS: ${{ needs.changelog.result }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci-ok.sh
