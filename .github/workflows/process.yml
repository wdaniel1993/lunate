name: Process

# Process rules that must not depend on anyone remembering them. They are cheap by design: seconds,
# not the verify suite's twenty minutes, so a rule about how work is delivered never becomes the
# reason a pull request waits.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  docs-region:
    name: docs-region
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # docs-sync --check runs in the docs profile only, so a prose-only pull request that
      # stales a generated region failed no PR gate until the tag: v0.2.0-rc.1 shipped a stale
      # docs/extensions/README.md (#433 fixed it after the tag). This always-on leg fails the
      # pull request that causes the staleness instead.
      - name: Check the generated docs regions
        run: python3 scripts/docs-sync --check

  archive-only:
    name: archive-only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The file list comes from the API rather than `git diff`: a pull request from a fork does not
      # have its head commit in this clone, and the merge ref's history depth is not ours to assume.
      - name: List the pull request's files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --paginate \
            "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --jq '.[].filename' > "$RUNNER_TEMP/files.txt"
          echo "changed files: $(wc -l < "$RUNNER_TEMP/files.txt")"

      - name: Decide
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # The labels are read through the API at run time, not from the event payload: a label
          # added after the triggering event (standalone-archive, for instance) has to count on a
          # plain rerun, and a rerun replays the original payload.
          labels="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json labels -q '[.labels[].name]|join(",")')"
          bash scripts/archive-only-check.sh --self-test
          bash scripts/archive-only-check.sh --paths-file "$RUNNER_TEMP/files.txt" --labels "$labels"
