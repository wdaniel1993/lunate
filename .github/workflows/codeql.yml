name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, Monday 01:30 UTC.
    - cron: '30 1 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (csharp)
    runs-on: ubuntu-latest
    # Fork pull requests run with a read-only token and cannot upload code
    # scanning results; skip them instead of failing the check.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            global.json
            Directory.Build.props
            **/*.csproj

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp
          build-mode: manual
          queries: security-extended

      - name: Build
        run: |
          set -euo pipefail
          dotnet restore lunate.sln
          dotnet build lunate.sln --no-restore -c Release

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:csharp"
