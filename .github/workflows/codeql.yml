name: CodeQL

on:
  # Prose cannot introduce a code-scanning finding, and the analysis builds the whole solution: a
  # docs-only change skipped CodeQL for seven minutes and proved nothing. The ignore list mirrors the
  # docs profile's allow-list in scripts/ci-plan.sh; a pull request that mixes prose with code still
  # runs, because paths-ignore only applies when every path matches.
  push:
    branches: [main]
    paths-ignore: &prose
      - '*.md'
      - 'docs/**'
      - 'adr/**'
      - 'openspec/**'
  pull_request:
    branches: [main]
    paths-ignore: *prose
  schedule:
    # Weekly, Monday 01:30 UTC.
    - cron: '30 1 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (csharp)
    runs-on: ubuntu-latest
    # Fork pull requests run with a read-only token and cannot upload code
    # scanning results; skip them instead of failing the check.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            global.json
            Directory.Build.props
            **/*.csproj

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: manual
          queries: security-extended

      - name: Build
        run: |
          set -euo pipefail
          dotnet restore lunate.slnx
          dotnet build lunate.slnx --no-restore -c Release

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:csharp"
